name: Telegram to DingTalk relay (manual recovery)

on:
  # Supabase Cron is the production scheduler. Keep this workflow only for an
  # explicit operator-run backfill or recovery, using the same durable cursor.
  workflow_dispatch:
    inputs:
      initial_sync_mode:
        description: "For a deliberate first run only: skip existing posts or send recent ones"
        required: false
        default: skip
        type: choice
        options:
          - skip
          - send_recent

permissions:
  contents: read

# Durable deduplication remains in Supabase if an operator retries a run.
concurrency:
  group: telegram-dingtalk-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out relay code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt

      - name: Relay new Telegram posts to DingTalk
        run: python relay.py
        env:
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SIGNING_SECRET: ${{ secrets.DINGTALK_SIGNING_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Scheduled runs safely skip history by default. A manual run may opt
          # into one bounded recent-post backfill to validate the delivery path.
          INITIAL_SYNC_MODE: ${{ inputs.initial_sync_mode || vars.INITIAL_SYNC_MODE || 'skip' }}
